name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Releases shipped source archives only, so the desktop companion could be
  # obtained exactly one way: install a Rust toolchain and compile it. Building
  # it here turns that into a download.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 in a container, not whatever `ubuntu-latest` is today:
          # the binary keeps the glibc symbol versions of the image that built
          # it, and a 24.04 build is unrunnable on 22.04 and Debian 12 no matter
          # what the person downloading it installs. See the same matrix in
          # ci.yml, where the resulting floor is asserted.
          - os: ubuntu-latest
            container: "ubuntu:22.04"
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before checkout: the image has no git, and actions/checkout would fall
      # back to a REST tarball rather than a working tree.
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Select stable Rust
        if: runner.os != 'Linux'
        run: |
          rustup update stable
          rustup default stable
      - name: Install stable Rust
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci --prefix apps/desktop
      - run: npm run build:binary --prefix apps/desktop
      # A release asset nobody can run is worse than a missing one: it is
      # downloaded, fails with a linker error, and reads as a corrupt file.
      # Fail the release instead.
      - name: Check the published glibc floor
        if: runner.os == 'Linux'
        run: |
          scripts/check-glibc-floor.sh \
            apps/desktop/src-tauri/target/release/codex-router-desktop 2.35
      # Named for the release rather than the build tree, so a downloaded asset
      # still says which version and platform it is.
      - name: Stage the companion under its release name
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          built=apps/desktop/src-tauri/target/release
          mkdir -p staged
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$built/codex-router-desktop.exe" "staged/codex-router-tray-${version}-windows-x64.exe"
          else
            cp "$built/codex-router-desktop" "staged/codex-router-tray-${version}-linux-x64"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: tray-${{ runner.os }}
          path: staged/*
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p 'require("./package.json").version')
          test "v$package_version" = "$GITHUB_REF_NAME"
      - name: Build source archives
        shell: bash
        run: |
          mkdir -p dist
          prefix="codex-router-${GITHUB_REF_NAME#v}/"
          git archive --format=tar.gz --prefix="$prefix" -o "dist/codex-router-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$prefix" -o "dist/codex-router-${GITHUB_REF_NAME#v}.zip" "$GITHUB_REF_NAME"
      # Before the checksums are taken, so the companion binaries are covered by
      # SHA256SUMS and the provenance attestation like every other asset.
      - name: Collect the companion binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tray-*
          path: dist
          merge-multiple: true
      - name: Checksum every asset
        shell: bash
        run: |
          cd dist
          sha256sum codex-router-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
      # This repository is its own Homebrew tap, so the formula is committed back
      # to main rather than pushed to a second repository. It points at the
      # release asset built above, whose checksum this job computed itself:
      # GitHub's generated archive/refs/tags tarballs are not stable enough to
      # pin a sha256 against. Pushing to main cannot retrigger this workflow,
      # which only runs on v* tags.
      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="codex-router-${version}.tar.gz"
          sha=$(awk -v file="$tarball" '$2 == file { print $1 }' dist/SHA256SUMS)
          test -n "$sha"
          # The job checked out the tag, which leaves HEAD detached. Reset a
          # local main onto the remote tip rather than assuming a branch exists.
          git fetch origin main
          git checkout -B main origin/main
          node packaging/homebrew/generate-formula.mjs \
            --version "$version" \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${tarball}" \
            --source-sha256 "$sha" \
            --output Formula/codex-router.rb
          if git diff --quiet -- Formula/codex-router.rb; then
            echo "Formula already matches ${GITHUB_REF_NAME}."
            exit 0
          fi
          git add Formula/codex-router.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update Homebrew formula for ${GITHUB_REF_NAME}"
          git push origin main
