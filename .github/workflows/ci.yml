name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Test the macOS tray
        if: runner.os == 'macOS'
        working-directory: apps/macos/ModelRouterTray
        run: swift test
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: for file in install.sh bin/* scripts/build-desktop-tray.sh scripts/check-glibc-floor.sh packaging/homebrew/check-core-readiness.sh; do [ "$(head -n 1 "$file")" != '#!/bin/sh' ] || sh -n "$file"; done
      - name: Check installer help
        if: runner.os != 'Windows'
        run: ./install.sh --help
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "codex-router.ps1", "model-router.ps1", "scripts/build-desktop-tray.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  # The committed formula pins every resource in requirements/python.txt, so a
  # lock change with no version bump leaves it stale while still looking correct.
  # Only run when an input actually moved: the check queries PyPI once per
  # locked package, which is too much traffic to spend on unrelated pull
  # requests.
  homebrew-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Check whether the formula inputs changed
        id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          if git diff --quiet "$base" HEAD -- requirements/python.txt packaging/homebrew Formula; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.changed.outputs.run == 'true'
      - name: Verify the formula matches the Python lock
        if: steps.changed.outputs.run == 'true'
        run: node packaging/homebrew/check-formula.mjs
      - name: Set up Homebrew
        id: set-up-homebrew
        if: steps.changed.outputs.run == 'true'
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
      - name: Cache Homebrew Bundler RubyGems
        id: cache-homebrew-gems
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Install Homebrew Bundler RubyGems
        if: steps.changed.outputs.run == 'true' && steps.cache-homebrew-gems.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
      - name: Audit the generated formula for Homebrew core
        if: steps.changed.outputs.run == 'true'
        run: packaging/homebrew/check-core-readiness.sh

  # A complete source build is intentionally manual because LiteLLM's locked
  # Python dependency tree is large. Run this on the candidate stable commit
  # before opening the homebrew/core pull request.
  homebrew-install:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
      - name: Build and test the formula from source
        run: packaging/homebrew/check-core-readiness.sh --install

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux companion links the build machine's glibc, and the newest
          # runner image put a floor under the published binary that no user
          # could clear: built on Ubuntu 24.04 it needs glibc 2.39, so it exits
          # with `version 'GLIBC_2.39' not found` on Ubuntu 22.04, Debian 12 and
          # every other still-supported older distribution. Building in a 22.04
          # container lowers that floor to 2.35 independently of which image
          # `ubuntu-latest` points at. 22.04 is as old as this can go: WebKitGTK
          # 4.1, which Tauri 2 requires, is not packaged before it.
          - os: ubuntu-latest
            container: "ubuntu:22.04"
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # The container is a bare image, so its build tools have to arrive before
      # checkout: without git, actions/checkout silently falls back to a REST
      # tarball, and the release job's `git archive` would have nothing to read.
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Select stable Rust
        if: runner.os != 'Linux'
        run: |
          rustup update stable
          rustup default stable
      # The image ships no rustup. `npm run check` runs cargo fmt, which the
      # minimal profile omits, so ask for the component by name.
      - name: Install stable Rust
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci --prefix apps/desktop
      - run: npm run check --prefix apps/desktop
      - run: npm run build:binary --prefix apps/desktop
      - name: Check the published glibc floor
        if: runner.os == 'Linux'
        run: |
          scripts/check-glibc-floor.sh \
            apps/desktop/src-tauri/target/release/codex-router-desktop 2.35
      # The companion needs a Rust toolchain and a multi-minute compile, which
      # is a hard prerequisite for anyone who only wants to run it. This job
      # already produces exactly the binary they need and was discarding it, so
      # there was no way to obtain a prebuilt tray anywhere -- every user had
      # to install Rust and build it themselves, or go without.
      - name: Publish the tray binary
        uses: actions/upload-artifact@v7
        with:
          name: codex-router-tray-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/codex-router-desktop
            apps/desktop/src-tauri/target/release/codex-router-desktop.exe
          if-no-files-found: error
          retention-days: 14

  control-center:
    name: Electron control center (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            builder_flag: --linux
            artifact_path: apps/control-center/release/codex-router-control-center-linux.tar.gz
          - platform: macOS
            os: macos-latest
            builder_flag: --mac --arm64 --x64
            artifact_path: |
              apps/control-center/release/*.dmg
              apps/control-center/release/*.zip
          - platform: Windows
            os: windows-latest
            builder_flag: --win
            artifact_path: apps/control-center/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Pull-request artifacts are deliberately unsigned. Production releases
      # must use the platform signing and notarization credentials instead.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install Electron dependencies
        run: npm ci
      - name: Check Electron sources
        run: npm run check
      - name: Test Electron integration
        run: npm test
      - name: Build the renderer
        run: npm run build
      - name: Package the native beta
        run: npx --no-install electron-builder ${{ matrix.builder_flag }}
      - name: Smoke the packaged Linux app
        if: runner.os == 'Linux'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          xvfb-run --auto-servernum bash -s <<'SMOKE'
          set -euo pipefail
          app="./release/linux-unpacked/codex-router-control-center"
          log="${RUNNER_TEMP}/control-center-linux.log"
          "$app" --no-sandbox >"$log" 2>&1 &
          pid=$!
          trap 'kill -KILL "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged Linux app exited early with status $status." >&2
            exit 1
          fi
          kill -TERM "$pid"
          for _ in {1..40}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              trap - EXIT
              exit 0
            fi
            sleep 0.25
          done
          cat "$log"
          echo "Packaged Linux app did not stop after SIGTERM." >&2
          exit 1
          SMOKE
      - name: Smoke the packaged macOS app
        if: runner.os == 'macOS'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          app="./release/mac-arm64/Codex Router.app/Contents/MacOS/Codex Router"
          log="${RUNNER_TEMP}/control-center-macos.log"
          "$app" >"$log" 2>&1 &
          pid=$!
          trap 'kill -KILL "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged macOS app exited early with status $status." >&2
            exit 1
          fi
          kill -TERM "$pid"
          for _ in {1..40}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              trap - EXIT
              exit 0
            fi
            sleep 0.25
          done
          cat "$log"
          echo "Packaged macOS app did not stop after SIGTERM." >&2
          exit 1
      - name: Smoke the packaged Windows app
        if: runner.os == 'Windows'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "control-center-windows.log"
          $stderr = Join-Path $env:RUNNER_TEMP "control-center-windows-error.log"
          $process = Start-Process ".\release\win-unpacked\Codex Router.exe" `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Windows app exited early with status $($process.ExitCode)."
            }
            if (-not $process.CloseMainWindow()) {
              throw "Packaged Windows app did not expose a window to close."
            }
            if (-not $process.WaitForExit(10000)) {
              throw "Packaged Windows app did not stop after its window was closed."
            }
            if ($process.ExitCode -ne 0) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Windows app stopped with status $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }
      - name: Preserve Linux executable permissions
        if: runner.os == 'Linux'
        working-directory: apps/control-center/release
        run: tar -czf codex-router-control-center-linux.tar.gz -- *.AppImage
      - name: Publish the unsigned beta package
        uses: actions/upload-artifact@v7
        with:
          name: codex-router-control-center-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
